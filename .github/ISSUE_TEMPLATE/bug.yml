name: Bug report / Reporte de error
description: Report a reproducible problem in F.Crack Player
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language / Idioma
      options:
        - Español
        - English
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Versión de Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / ¿Qué ocurrió?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducir
    validations:
      required: true
